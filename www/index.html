<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALI MAHMOUD AI</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="app">

    <header>
      <button id="menuBtn">☰</button>
      <div>
        <h1>ALI MAHMOUD AI</h1>
        <p>AI Assistant</p>
      </div>
      <button id="newChatBtn">＋</button>
    </header>

    <aside id="sidebar">
      <button id="newChatSide">＋ دردشة جديدة</button>

      <h3>💬 الدردشات</h3>
      <div id="chatList"></div>

      <h3>📁 المشاريع</h3>
      <button id="newProjectBtn">＋ مشروع جديد</button>
      <div id="projectList"></div>

      <button id="plansBtn">⭐ Plans</button>
    </aside>

    <main>
      <section id="messages"></section>

      <div id="typing" class="typing hidden">
        ALI MAHMOUD AI يكتب...
      </div>

      <div class="input-area">

        <button id="attachBtn" title="رفع ملف">
          📎
        </button>

        <input
          id="fileInput"
          type="file"
          hidden
          multiple
        >

        <input
          id="messageInput"
          type="text"
          placeholder="اكتب سؤالك هنا..."
          autocomplete="off"
        >

        <button id="sendBtn" title="إرسال">
          ➤
        </button>

      </div>

      <div class="tools">
        <button id="codeBtn">💻 Code</button>
        <button id="previewBtn">👁 Preview</button>
        <button id="uploadBtn">📎 Files</button>
      </div>
    </main>

  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <button id="closeModal">✕</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
